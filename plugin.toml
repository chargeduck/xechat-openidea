id = "xechat.openidea"
name = "XEChat Moyu"
version = "0.1.0"
description = "Moyu chat: join an xechat pond from the IDE — read and send messages, see who is online, open the game hall."
authors = ["xechat"]
homepage = "https://dld.lesscoding.net"
license = "Apache-2.0"
change-notes = "0.1.0 — First release: side-panel Moyu chat as a web view; WebSocket and HTTP requests are proxied through the plugin."
categories = ["tools"]
icon = "icons/xechat.svg"
engines.openidea = "^1.6"
wasm = "dist/plugin.wasm"
activation = ["on-view:chat", "on-event:websocket-ready"]

[capabilities]
required = ["events"]
optional = ["net:dld.lesscoding.net", "net:*.lesscoding.net", "net:ask", "clipboard"]

[[contributes.views]]
id = "chat"
title = "Moyu"
icon = "icons/xechat.svg"
location = "right"
web = "web/index.html"

[[contributes.commands]]
id = "open"
title = "XEChat: Open Moyu Chat"
category = "XEChat"
icon = "icons/xechat.svg"

[[contributes.menus]]
menu = "tools"
command = "open"
